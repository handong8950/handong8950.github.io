<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>个人作品集</title>
    <meta name="description" content="个人作品集展示网站" />
    <link rel="stylesheet" href="styles.css?v=20260918" />
    <script src="app.js?v=20260918" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#top" aria-label="返回顶部">
        <span class="brand-mark" aria-hidden="true"></span>
        <span id="brandName">Portfolio</span>
      </a>
      <nav class="nav-links" aria-label="主导航">
        <a href="#projects">作品</a>
        <a href="#about">关于</a>
        <a href="#contact">联系</a>
        <a href="admin" class="admin-link">管理</a>
      </nav>
    </header>

    <main id="top">
      <section class="intro-section" aria-labelledby="heroName">
        <div class="intro-copy">
          <p class="eyebrow" id="profileTitle">个人作品集</p>
          <h1 id="heroName">我的作品集</h1>
          <p class="hero-line" id="heroHeadline">把想法做成可使用、可展示、可维护的作品。</p>
          <p class="hero-summary" id="heroSummary"></p>
          <div class="hero-actions">
            <a class="primary-action" href="#projects">查看作品</a>
            <a class="secondary-action" href="#contact">联系我</a>
          </div>
          <dl class="metrics" aria-label="作品集概览">
            <div>
              <dt id="projectCount">0</dt>
              <dd>项目</dd>
            </div>
            <div>
              <dt id="categoryCount">0</dt>
              <dd>方向</dd>
            </div>
            <div>
              <dt id="featuredCount">0</dt>
              <dd>重点展示</dd>
            </div>
          </dl>
        </div>

        <div class="hero-gallery" aria-label="重点项目预览">
          <div class="gallery-lead">
            <span>Featured Work</span>
            <strong id="galleryLeadTitle">近期作品</strong>
          </div>
          <div class="gallery-strip" id="heroGallery"></div>
        </div>
      </section>

      <section class="project-section" id="projects" aria-labelledby="projectHeading">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Selected Projects</p>
            <h2 id="projectHeading">作品展示</h2>
          </div>
          <div class="project-tools">
            <label class="search-box">
              <span class="sr-only">搜索项目</span>
              <input id="searchInput" type="search" placeholder="搜索项目、技术栈或方向" autocomplete="off" />
            </label>
          </div>
        </div>
        <div class="filter-tabs" id="categoryTabs" aria-label="按方向筛选"></div>
        <div class="project-grid" id="projectGrid"></div>
        <div class="empty-state" id="emptyState" hidden>
          <strong>暂时没有匹配的项目</strong>
          <span>换个关键词或分类试试。</span>
        </div>
      </section>

      <section class="about-section" id="about" aria-labelledby="aboutHeading">
        <div>
          <p class="eyebrow">About</p>
          <h2 id="aboutHeading">关于我</h2>
          <p id="aboutText"></p>
        </div>
        <div class="profile-facts">
          <div>
            <span>所在地</span>
            <strong id="profileLocation">中国</strong>
          </div>
          <div>
            <span>状态</span>
            <strong id="profileAvailability">开放交流</strong>
          </div>
          <div>
            <span>联系</span>
            <strong id="profileEmail">hello@example.com</strong>
          </div>
        </div>
      </section>

      <section class="contact-section" id="contact" aria-labelledby="contactHeading">
        <div>
          <p class="eyebrow">Contact</p>
          <h2 id="contactHeading">一起聊聊下一个作品</h2>
        </div>
        <div class="contact-actions" id="contactLinks"></div>
      </section>
    </main>

    <div class="modal" id="projectModal" hidden>
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="icon-button modal-close" id="closeModal" type="button" aria-label="关闭">×</button>
        <img id="modalImage" alt="" />
        <div class="modal-content">
          <p class="eyebrow" id="modalMeta"></p>
          <h2 id="modalTitle"></h2>
          <p id="modalSummary"></p>
          <p id="modalDescription"></p>
          <div class="tag-list" id="modalTags"></div>
          <div class="link-row" id="modalLinks"></div>
        </div>
      </div>
    </div>

    <footer class="site-footer">
      <span id="footerName">Portfolio</span>
      <span>公开可浏览，后台受保护。</span>
    </footer>
  </body>
</html>
